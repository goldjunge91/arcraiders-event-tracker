name: ARC Raiders Event Tracker

on:
  schedule:
    # Läuft alle 15 Minuten automatisch
    - cron: '*/15 * * * *'
  workflow_dispatch: # Ermöglicht manuelles Ausführen im GitHub Interface

jobs:
  track-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymongo dnspython certifi

      - name: Run Tracker & Sync to MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python mongo_tracker.py

      # Optional: Speichert zusätzlich eine JSON-Kopie im Git-Repo für التاريخ / Flat Data
      - name: Export JSON snapshot (optional)
        run: |
          mkdir -p data
          python -c "
          import json
          from mongo_tracker import parse_events_from_text, sample_text
          events = parse_events_from_text(sample_text)
          for e in events:
              e['startTime'] = e['startTime'].isoformat()
              e['endTime'] = e['endTime'].isoformat()
              e['updatedAt'] = e['updatedAt'].isoformat()
          with open('data/latest_events.json', 'w') as f:
              json.dump(events, f, indent=2)
          "
      - name: Commit snapshot if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Tracker"
          git add data/latest_events.json || true
          git diff --staged --quiet || (git commit -m "chore: update event snapshot [skip ci]" && git push)
