name: ARC Raiders Event Tracker

on:
  schedule:
    # Läuft alle 15 Minuten automatisch
    - cron: '*/15 * * * *'
  workflow_dispatch: # Ermöglicht manuelles Ausführen im GitHub Interface

jobs:
  track-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymongo dnspython certifi

      - name: Run Tracker & Sync to MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python mongo_tracker.py

      - name: Commit updated event history snapshot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Tracker"
          git add data/events.json index.html || true
          git diff --staged --quiet || (git commit -m "chore: auto-update event history snapshot" && git push)
